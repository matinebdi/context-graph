[project]
name = "context-graph"
version = "0.5.0"
description = "Claude Code plugin: long-term memory for Claude as a Neo4j knowledge graph (MCP server + CLI)."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastembed>=0.5",
    "mcp>=2.3,<3",
    "neo4j>=5.20",
    "pyyaml>=6",
]

[project.scripts]
context-graph = "context_graph.cli.app:ContextGraphCLI.main"
context-graph-mcp = "context_graph.server.app:ContextGraphServer.main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
