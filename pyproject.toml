[project]
name = "context-graph"
version = "0.1.0"
description = "A persistent, git-tracked context graph that Claude reads and writes through MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
]

[project.scripts]
context-graph = "context_graph.cli:main"
context-graph-mcp = "context_graph.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
